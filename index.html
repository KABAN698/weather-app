<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title></title>
</head>
<body>
    <div class="main">
        <div class="container">
            <h1 class="title">Погода в <span>Москве</span></h1>
            <div class="info">
                <p class="weather-icon">☀️</p> 
                <p class="degrees">0°</p>
                <div class="extra-info">
                    <p class="wind">Ветер💨: <span>--</span> м/с</p>
                    <p class="humidity">Влажность💧: <span>--</span>%</p>
                </div>
            </div>
            <input class="input" type="text" placeholder="Введите город">
            <button class="find">Найти город</button>
            <button class="geo-btn">Найти по геопозиция</button> 
        </div>
    </div>
</body>
    <script src="script.js"></script>
</html>
